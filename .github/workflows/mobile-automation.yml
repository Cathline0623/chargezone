name: Mobile Automation

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to test"
        required: true
        default: chargezone
        type: choice
        options:
          - chargezone
          - healync
      spec:
        description: "Spec file name (e.g. Healync_Login.js). Empty = run all specs of that app"
        required: false
        default: ""

jobs:
  emulator-tests:
    name: Android Emulator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      APP_TARGET: ${{ github.event.inputs.app || 'chargezone' }}
      SPEC: ${{ github.event.inputs.spec || '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate APKs from Git LFS
        run: |
          git lfs install
          git lfs pull
          ls -lh apk/
          for f in apk/*.apk; do unzip -tq "$f"; done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Install Appium
        run: |
          npm install -g appium@3
          appium driver install uiautomator2
          appium --version
          appium driver list --installed

      - name: Run Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          heap-size: 576M
          emulator-boot-timeout: 900
          disable-animations: true
          disable-linux-hw-accel: false
          force-avd-creation: false
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
            -gpu swiftshader_indirect
            -no-metrics
          script: bash ./ci-run.sh

      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate
        continue-on-error: true

      - name: Upload Emulator Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results-${{ env.APP_TARGET }}
          path: |
            reports/
            allure-report/
            screenshots/
            logs/
            log/
          if-no-files-found: warn
          retention-days: 15



















































